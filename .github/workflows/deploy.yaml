name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main  # Run this workflow when pushing to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      # Step 4: Git Setup for Deployment to Hugging Face
      - name: Set up Git for Hugging Face
        run: |
          git config --global user.name "FaiqImran"
          git config --global user.email "your-email@example.com"  # Replace with your email

      # Step 5: Push Code to Hugging Face Spaces Repository
      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # Use the secret token for authentication
        run: |
          # Log in to Hugging Face
          pip install huggingface_hub
          huggingface-cli login --token $HF_TOKEN

          # Clone the Hugging Face repository for the Space
          huggingface-cli repo create spam-or-ham --type space --sdk streamlit --yes
          git clone https://huggingface.co/spaces/Fiqa/SpamHam_Project

          # Move your files into the space repository
          cp app.py spam-or-ham/
          cp requirements.txt spam-or-ham/

          # Commit and push the changes
          cd spam-or-ham
          git add .
          git commit -m "Deploy Streamlit app"
          git push
