name: CI/CD for ML Model to Hugging Face Spaces

on:
  push:
    branches:
      - FaiqImran123  # Trigger deployment on push to the 'FaiqImran123' branch
  pull_request:
    branches:
      - FaiqImran123

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Install dependencies from your requirements.txt

    - name: Log in to Hugging Face
      run: |
        mkdir -p ~/.huggingface  # Create the directory if it doesn't exist
        echo "HUGGINGFACE_API_KEY=${{ secrets.HF_API_TOKEN }}" > ~/.huggingface/token  # Store Hugging Face API token in a file

    - name: Push app to Hugging Face Space
      run: |
        # Clone the Hugging Face Space repository
        git clone https://huggingface.co/spaces/Fiqa/SpamHam_Project
        cd SpamHam_Project
        
        # Copy your app files and requirements.txt to the Space repository
        cp -r * .  # Change 'path_to_your_app' to the actual folder where your app is

        # Commit and push the changes to Hugging Face Space
        git add .
        git commit -m "Deploy new Streamlit app version"
        git push origin FaiqImran123  # Push changes to your custom branch ('FaiqImran123')
