name: CI/CD for ML Model to Hugging Face Spaces

on:
  push:
    branches:
      - FaiqImran123  # Trigger deployment on push to the main branch
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Log in to Hugging Face
      run: |
        echo "HUGGINGFACE_API_KEY=${{ secrets.HF_API_TOKEN }}" > ~/.huggingface/token
    
    - name: Push model to Hugging Face Spaces
      run: |
        git clone https://huggingface.co/spaces/Fiqa/SpamHam_Project
        cd your-space-name
        cp -r ../model/* .  # Copy model files into the space repository
        git add .
        git commit -m "Deploy new model version"
        git push origin main

